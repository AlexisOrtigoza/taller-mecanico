<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar cliente - Taller Mecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 700px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white"><h4 class="mb-0">Modificar cliente</h4></div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-danger" role="alert">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label class="form-label" for="cedula">Número de Cédula *</label>
                        <input class="form-control" id="cedula" name="cedula" required value="{{ cliente.cedula }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="nombre">Nombre *</label>
                            <input class="form-control" id="nombre" name="nombre" required value="{{ cliente.nombre }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="apellido">Apellido *</label>
                            <input class="form-control" id="apellido" name="apellido" required value="{{ cliente.apellido }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="telefono">Celular / Teléfono *</label>
                        <input class="form-control" id="telefono" name="telefono" required value="{{ cliente.telefono }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="direccion">Dirección</label>
                        <input class="form-control" id="direccion" name="direccion" value="{{ cliente.direccion or '' }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="ciudad">Ciudad</label>
                            <input class="form-control" id="ciudad" name="ciudad" value="{{ cliente.ciudad or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="barrio">Barrio</label>
                            <input class="form-control" id="barrio" name="barrio" value="{{ cliente.barrio or '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="fecha_nacimiento">Fecha de nacimiento</label>
                        <input class="form-control" type="date" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ cliente.fecha_nacimiento.strftime('%Y-%m-%d') if cliente.fecha_nacimiento else '' }}">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a class="btn btn-secondary" href="{{ url_for('clientes.lista_clientes') }}">Cancelar</a>
                        <button class="btn btn-primary" type="submit">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
