<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Vehículo - Taller Mecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 650px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">🚗 Registrar Nuevo Vehículo</h4>
            </div>
            <div class="card-body">
                
                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <form action="{{ url_for('vehiculos.nuevo_vehiculo', volver_a_orden='1' if volver_a_orden else none) }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <!-- Selección del Dueño (Cliente registrado) -->
                    <div class="mb-3">
                        <label for="cliente_id" class="form-label">Dueño / Cliente *</label>
                        <select class="form-select" id="cliente_id" name="cliente_id" required>
                            <option value="" disabled selected>Selecciona un cliente...</option>
                            {% for c in clientes %}
                                <option value="{{ c[0] }}">CI: {{ c[1] }} - {{ c[2] }} {{ c[3] }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Si el cliente no aparece, regístralo primero en la sección de clientes.</div>
                    </div>

                    <hr class="my-3">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="marca" class="form-label">Marca *</label>
                            <input type="text" class="form-control" id="marca" name="marca" required placeholder="Ej: Toyota">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="modelo" class="form-label">Modelo *</label>
                            <input type="text" class="form-control" id="modelo" name="modelo" required placeholder="Ej: IST">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="anio" class="form-label">Año</label>
                            <input type="number" class="form-control" id="anio" name="anio" min="1900" max="2100" placeholder="Ej: 2008">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="kilometraje" class="form-label">Kilometraje</label>
                            <input type="number" class="form-control" id="kilometraje" name="kilometraje" placeholder="Ej: 120000">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="chapa" class="form-label">Número de Chapa / Matrícula *</label>
                        <input type="text" class="form-control" id="chapa" name="chapa" required placeholder="Ej: ABC 123" value="{{ chapa_inicial or '' }}">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Volver al Dashboard</a>
                        <button type="submit" class="btn btn-primary">Guardar Vehículo</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
