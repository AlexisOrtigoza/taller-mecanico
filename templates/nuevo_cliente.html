<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Cliente - Taller Mecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 650px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">👤 Registrar Nuevo Cliente</h4>
            </div>
            <div class="card-body">
                
                <!-- Mensaje de error si faltan datos obligatorios -->
                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <form action="{{ url_for('clientes.nuevo_cliente', volver_a_orden='1' if volver_a_orden else none) }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <!-- Sección Obligatoria -->
                    <h5 class="text-primary mb-3">Datos Obligatorios</h5>
                    
                    <div class="mb-3">
                        <label for="cedula" class="form-label">Número de Cédula *</label>
                        <input type="text" class="form-control" id="cedula" name="cedula" required placeholder="Ej: 1234567" value="{{ cedula_inicial or '' }}">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ej: Juan">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="apellido" class="form-label">Apellido *</label>
                            <input type="text" class="form-control" id="apellido" name="apellido" required placeholder="Ej: Pérez">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="celular" class="form-label">Celular / Teléfono *</label>
                        <input type="text" class="form-control" id="celular" name="celular" required placeholder="Ej: 0981123456">
                    </div>

                    <hr class="my-4">

                    <!-- Sección Secundaria / Opcional -->
                    <h5 class="text-secondary mb-3">Datos Secundarios (Opcionales)</h5>

                    <div class="mb-3">
                        <label for="direccion" class="form-label">Dirección de Domicilio</label>
                        <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Ej: Av. Mariscal López 1234">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="ciudad" class="form-label">Ciudad</label>
                            <input type="text" class="form-control" id="ciudad" name="ciudad" placeholder="Ej: Asunción">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="barrio" class="form-label">Barrio</label>
                            <input type="text" class="form-control" id="barrio" name="barrio" placeholder="Ej: Villa Morra">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento">
                    </div>

                    <!-- Botones de acción -->
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Volver al Dashboard</a>
                        <button type="submit" class="btn btn-primary">Guardar Cliente</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
