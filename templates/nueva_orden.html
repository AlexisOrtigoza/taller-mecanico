<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Orden de Trabajo - Taller Mecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4 mb-5" style="max-width: 950px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">🔧 Registrar Nueva Orden de Trabajo</h4>
                <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-light btn-sm">Volver al Dashboard</a>
            </div>
            <div class="card-body">
                
                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <form action="{{ url_for('ordenes.nueva_orden') }}" method="POST">
                    
                    <!-- Selección del Vehículo -->
                    <div class="mb-3">
                        <label for="vehiculo_id" class="form-label fw-bold">Vehículo (Marca, Modelo y Chapa) *</label>
                        <select class="form-select" id="vehiculo_id" name="vehiculo_id" required>
                            <option value="" disabled selected>Selecciona un vehículo...</option>
                            {% for v in vehiculos %}
                                <option value="{{ v[0] }}">{{ v[1] }} {{ v[2] }} - Chapa: {{ v[3] }} (Dueño: {{ v[4] }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Síntoma o Diagnóstico inicial -->
                    <div class="mb-3">
                        <label for="sintoma" class="form-label fw-bold">Síntoma o Motivo de Ingreso *</label>
                        <textarea class="form-control" id="sintoma" name="sintoma" rows="2" required placeholder="Ej: Ruido en el tren delantero y cambio de aceite"></textarea>
                    </div>

                    <hr class="my-4">

                    <!-- PLANILLA DE REPUESTOS Y SERVICIOS -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0 text-primary">Repuestos, Materiales y Mano de Obra</h5>
                        <button type="button" class="btn btn-success btn-sm" id="btn-agregar-fila">+ Agregar Línea (Enter)</button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered align-middle" id="tabla-repuestos">
                            <thead class="table-secondary">
                                <tr>
                                    <th style="width: 40%;">Ítem / Repuesto / Servicio</th>
                                    <th style="width: 15%;">Cantidad</th>
                                    <th style="width: 20%;">Precio Unitario (Gs.)</th>
                                    <th style="width: 15%;">Subtotal (Gs.)</th>
                                    <th style="width: 10%;">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <select name="repuesto_id[]" class="form-select select-repuesto" required>
                                            <option value="" disabled selected data-precio="0">Selecciona un producto o servicio...</option>
                                            {% for r in repuestos %}
                                                <!-- Guardamos el precio en data-precio y el nombre en data-nombre para evaluar si es mano de obra -->
                                                <option value="{{ r[0] }}" data-precio="{{ r[3] }}" data-nombre="{{ r[1] | lower }}">
                                                    {{ r[1] }} (Stock: {{ r[2] }} - Gs. {{ r[3] }})
                                                </option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" name="cantidad[]" class="form-control input-cantidad" min="1" value="1" required>
                                    </td>
                                    <td>
                                        <input type="number" step="0.01" name="precio_unitario[]" class="form-control input-precio" value="0" readonly required>
                                    </td>
                                    <td>
                                        <input type="text" class="form-control-plaintext fw-bold text-end input-subtotal" value="0" readonly>
                                    </td>
                                    <td class="text-center">
                                        <button type="button" class="btn btn-danger btn-sm btn-eliminar-fila">X</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- TOTAL GENERAL EN VIVO -->
                    <div class="d-flex justify-content-end align-items-center mt-3 p-3 bg-light border rounded">
                        <h4 class="mb-0 me-3">Total General Estimado:</h4>
                        <h3 class="mb-0 text-success fw-bold" id="total-general">Gs. 0</h3>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Guardar Orden Completa</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE INTELIGENCIA DE CAJA Y NAVEGACIÓN CON ENTER -->
    <script>
        // Función para recalcular subtotales y total general
        function calcularTotales() {
            let totalGeneral = 0;
            const filas = document.querySelectorAll('#tabla-repuestos tbody tr');

            filas.forEach(fila => {
                const cantidad = parseFloat(fila.querySelector('.input-cantidad').value) || 0;
                const precio = parseFloat(fila.querySelector('.input-precio').value) || 0;
                const subtotal = cantidad * precio;

                fila.querySelector('.input-subtotal').value = subtotal.toLocaleString('es-PY');
                totalGeneral += subtotal;
            });

            document.getElementById('total-general').innerText = 'Gs. ' + totalGeneral.toLocaleString('es-PY');
        }

        // Función para agregar una nueva fila limpia
        function agregarFilaRepuesto() {
            const tbody = document.querySelector('#tabla-repuestos tbody');
            const primeraFila = tbody.querySelector('tr');
            const nuevaFila = primeraFila.cloneNode(true);

            nuevaFila.querySelector('.input-cantidad').value = '1';
            nuevaFila.querySelector('.input-precio').value = '0';
            nuevaFila.querySelector('.input-subtotal').value = '0';
            nuevaFila.querySelector('.select-repuesto').selectedIndex = 0;

            tbody.appendChild(nuevaFila);
            calcularTotales();
            return nuevaFila.querySelector('.select-repuesto');
        }

        // Evento para cuando se selecciona un repuesto del desplegable
        document.addEventListener('change', function(event) {
            if (event.target.classList.contains('select-repuesto')) {
                const select = event.target;
                const fila = select.closest('tr');
                const optionSeleccionada = select.options[select.selectedIndex];
                
                const precio = optionSeleccionada.getAttribute('data-precio') || 0;
                const nombreProducto = optionSeleccionada.getAttribute('data-nombre') || '';

                const inputPrecio = fila.querySelector('.input-precio');

                // Asignamos el precio automático del inventario
                inputPrecio.value = precio;

                // REGLA INTELIGENTE: Si el producto contiene la palabra "mano de obra" o "servicio", permitimos editar el precio a mano
                if (nombreProducto.includes('mano de obra') || nombreProducto.includes('servicio')) {
                    inputPrecio.removeAttribute('readonly');
                    inputPrecio.focus();
                    inputPrecio.select();
                } else {
                    inputPrecio.setAttribute('readonly', true);
                }

                calcularTotales();
            }
        });

        // Recalcular al modificar cantidades o precios manuales
        document.addEventListener('input', function(event) {
            if (event.target.classList.contains('input-cantidad') || event.target.classList.contains('input-precio')) {
                calcularTotales();
            }
        });

        // Botón "+ Agregar Línea"
        document.getElementById('btn-agregar-fila').addEventListener('click', function(e) {
            e.preventDefault();
            const nuevoSelect = agregarFilaRepuesto();
            nuevoSelect.focus();
        });

        // Eliminar fila
        document.addEventListener('click', function(event) {
            if (event.target.classList.contains('btn-eliminar-fila')) {
                const tbody = document.querySelector('#tabla-repuestos tbody');
                if (tbody.querySelectorAll('tr').length > 1) {
                    event.target.closest('tr').remove();
                    calcularTotales();
                } else {
                    alert("Debe haber al menos una línea en la orden.");
                }
            }
        });

        // Navegación horizontal con la tecla Enter (Estilo Caja de Supermercado)
        document.querySelector('#tabla-repuestos').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                
                const elementoActual = event.target;
                const filaActual = elementoActual.closest('tr');

                if (elementoActual.classList.contains('select-repuesto')) {
                    filaActual.querySelector('.input-cantidad').focus();
                } else if (elementoActual.classList.contains('input-cantidad')) {
                    const inputPrecio = filaActual.querySelector('.input-precio');
                    inputPrecio.focus();
                    if (!inputPrecio.hasAttribute('readonly')) {
                        inputPrecio.select();
                    }
                } else if (elementoActual.classList.contains('input-precio')) {
                    const nuevoSelect = agregarFilaRepuesto();
                    nuevoSelect.focus();
                }
            }
        });
    </script>

</body>
</html>
